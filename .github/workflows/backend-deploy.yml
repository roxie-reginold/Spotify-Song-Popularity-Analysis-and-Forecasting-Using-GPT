name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'llm_endpoint.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'spotify_utils.py'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }} # You'll need to add this in GitHub secrets
          api-key: ${{ secrets.RENDER_API_KEY }} # You'll need to add this in GitHub secrets

      - name: Wait for deployment to finish
        run: sleep 60 # Wait for Render deployment to complete

      - name: Verify deployment
        run: |
          echo "Backend deployment to Render completed!"
          echo "Verify your deployment at https://dashboard.render.com/"
